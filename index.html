<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Details</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* Top blue bar */
    .topbar {
      height: 52px;
      background: #1976c9;
      display: flex;
      align-items: center;
      padding: 0 24px;
      color: white;
      font-weight: bold;
    }

    /* Task information */
    .task-info {
      height: 45px;
      background: #e5e5e5;
      border-bottom: 1px solid #999;
      display: flex;
      align-items: center;
      padding: 0 30px;
      gap: 40px;
      font-size: 15px;
    }

    /* Empty workspace */
    .workspace {
      min-height: calc(100vh - 97px);
      padding: 30px;
      background: #fafafa;
    }

    .back-button {
      padding: 8px 16px;
      border: none;
      background: #1976c9;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- Top Bar -->
  <div class="topbar">
    TASK MANAGER
  </div>

  <!-- Task Name and ID -->
  <div class="task-info">
    <span id="taskName">Task name: Loading...</span>
    <span id="taskId">Task ID: Loading...</span>
  </div>

  <!-- Empty Area -->
  <div class="workspace">
    <button class="back-button" onclick="window.location.href='index.html'">
      ← Back to Tasks
    </button>
  </div>

  <script>
    // Get Task ID from URL
    const params = new URLSearchParams(window.location.search);
    const clickedTaskId = params.get('id');

    const STORAGE_KEY = 'board-state';

    // Get saved task data
    const savedState = localStorage.getItem(STORAGE_KEY);

    if (savedState && clickedTaskId) {
      try {
        const state = JSON.parse(savedState);

        const task = state.tasks.find(
          t => String(t.id) === String(clickedTaskId)
        );

        if (task) {
          document.getElementById('taskName').textContent =
            'Task name: ' + task.title;

          document.getElementById('taskId').textContent =
            'Task ID: ' + task.id;
        } else {
          document.getElementById('taskName').textContent =
            'Task not found';
          document.getElementById('taskId').textContent = '';
        }
      } catch (error) {
        console.error('Error loading task:', error);
      }
    }
  </script>

</body>
</html>
